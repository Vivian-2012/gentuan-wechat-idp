<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微信登录 · 小灵群 IdP 试验</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --wx:#07c160; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;max-width:400px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.06)}
    h1{font-size:20px;margin-bottom:8px}
    p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:18px}
    .btn{display:block;width:100%;text-align:center;padding:12px 16px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;background:var(--wx);color:#fff;text-decoration:none}
    .btn:hover{filter:brightness(.95)}
    .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);margin-top:10px}
    .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#ecfdf5;color:#059c4d;margin-bottom:10px}
    .warn{font-size:12px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px;margin-bottom:14px;line-height:1.45}
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">独立试验仓库 · 非现站</div>
    <h1>微信登录（IdP）</h1>
    <p>仅做身份登录，不含微信支付。后端用 Cloudflare Worker 换 code；前端保存会话后可对接现有 Supabase。</p>
    <div class="warn" id="status">检查后端…</div>
    <button class="btn" id="wxLogin" type="button">微信登录</button>
    <a class="btn ghost" href="./app.html">进入试验页（需已登录）</a>
  </div>
  <script src="./config.js"></script>
  <script src="./auth.js"></script>
  <script>
    const status = document.getElementById('status');
    const btn = document.getElementById('wxLogin');
    btn.addEventListener('click', () => GTAuth.startWechatLogin());

    (async () => {
      if (GTAuth.isLoggedIn()) {
        status.textContent = '已登录：' + GTAuth.displayName() + (GTAuth.isAdmin() ? '（管理员）' : '');
        status.style.color = '#059c4d';
        status.style.background = '#ecfdf5';
        status.style.borderColor = '#a7f3d0';
        return;
      }
      try {
        const r = await fetch(GT_WECHAT.API_BASE.replace(/\/$/,'') + '/health');
        const d = await r.json();
        status.textContent = d.mock
          ? '后端在线 · MOCK 模式（无需真实微信凭证即可点登录）'
          : '后端在线 · 将跳转微信扫码';
      } catch (e) {
        status.textContent = '后端未启动。请先在 be/ 运行 npm run dev（默认 8787）。';
        status.style.color = '#dc2626';
        status.style.background = '#fee2e2';
        status.style.borderColor = '#fecaca';
      }
    })();
  </script>
</body>
</html>
