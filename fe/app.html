<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录后试验页</title>
  <style>
    body{font-family:-apple-system,"PingFang SC",sans-serif;background:#f5f6f8;color:#1f2328;padding:24px;max-width:640px;margin:0 auto}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:14px}
    h1{font-size:18px;margin:0 0 8px}
    pre{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:12px;overflow:auto;font-size:12px}
    .btn{display:inline-block;padding:8px 14px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;font-size:13px;text-decoration:none;color:inherit;margin-right:8px}
    .ok{color:#059c4d}.bad{color:#dc2626}
  </style>
</head>
<body>
  <div class="card">
    <h1>试验页 · 微信会话</h1>
    <p id="who" style="font-size:13px;color:#6b7280"></p>
    <button class="btn" type="button" id="logout">退出</button>
    <a class="btn" href="./index.html">回首页</a>
  </div>
  <div class="card">
    <h1>会话内容</h1>
    <pre id="sess"></pre>
  </div>
  <div class="card">
    <h1>权限</h1>
    <p id="perm"></p>
    <p style="font-size:12px;color:#6b7280;margin-top:8px">正式环境：把 <code>ADMIN_OPENIDS</code> 配成你的微信 openid；并配置 Supabase Service Role 后，此 token 可直接调现站受保护 API。</p>
  </div>
  <script src="./config.js"></script>
  <script src="./auth.js"></script>
  <script>
    if (!GTAuth.isLoggedIn()) {
      location.replace('./index.html');
    } else {
      const s = GTAuth.getSession();
      document.getElementById('who').textContent = GTAuth.displayName() + (s.mock ? ' · MOCK 会话' : '');
      document.getElementById('sess').textContent = JSON.stringify(s, null, 2);
      const admin = GTAuth.isAdmin();
      document.getElementById('perm').innerHTML = admin
        ? '<span class="ok">管理员（可对接跟团写接口）</span>'
        : '<span class="bad">普通访客（仅登录身份；区域数据仍靠区域密码）</span>';
      document.getElementById('logout').onclick = () => GTAuth.logout();
    }
  </script>
</body>
</html>
